<svg xmlns="http://www.w3.org/2000/svg" width="780" height="282" viewBox="0 0 780 282" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Two conversations from agent A-01</title>
  <desc id="desc">The Verification API checks the agent’s signed proof and current registry record. The channel allows the first conversation. Once the record is revoked, the channel blocks the next conversation from the same agent on account M-01.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#8497a9" />
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="282" rx="0" fill="#ffffff" />
  <rect x="227" y="12" width="274" height="60" rx="10" fill="#f0f5fb" />
  <path d="M-14 -8C-14 -15 14 -15 14 -8S-14 -1 -14 -8Z M-14 -8V10C-14 17 14 17 14 10V-8 M-14 1C-14 8 14 8 14 1" transform="translate(252 41) scale(0.78)" fill="#edf4fc" stroke="#295e9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="278" y="37" text-anchor="start" font-size="17" fill="#1c324b" font-weight="600">Identity registry</text>
  <text x="278" y="58" text-anchor="start" font-size="14" fill="#4b6076" font-weight="400">Verified brand · Account M-01</text>
  <path d="M364 73V136" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="3 4" />
  <path d="M-5 -13V-17M-6 -17H-4 M-14 -11H14Q18 -11 18 -7V10Q18 14 14 14H-14Q-18 14 -18 10V-7Q-18 -11 -14 -11Z M-8 -2V2M8 -2V2M-5 8H5" transform="translate(86 166) scale(1.18)" fill="#edf4fc" stroke="#295e9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M0 -19Q9 -13 17 -12V0Q16 12 0 20Q-16 12 -17 0V-12Q-9 -13 0 -19Z M-8 0L-2 6L9 -6" transform="translate(364 166) scale(1.22)" fill="#edf4fc" stroke="#295e9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M116 166H334" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="225" y="153" text-anchor="middle" font-size="15" fill="#4b6076" font-weight="400">Signed proof</text>
  <text x="86" y="218" text-anchor="middle" font-size="20" fill="#1c324b" font-weight="600">Agent A-01</text>
  <text x="86" y="242" text-anchor="middle" font-size="15" fill="#4b6076" font-weight="400">Support agent</text>
  <text x="364" y="218" text-anchor="middle" font-size="20" fill="#1c324b" font-weight="600">Verification API</text>
  <text x="364" y="242" text-anchor="middle" font-size="15" fill="#4b6076" font-weight="400">Proof, binding, scope and status</text>
  <path d="M395 166H480" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M480 166V123Q480 117 486 117H534" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M480 166V211Q480 217 486 217H534" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="545" y="60" text-anchor="start" font-size="18" fill="#1c324b" font-weight="600">Channel decision</text>
  <rect x="545" y="85" width="222" height="64" rx="10" fill="#eef7f4" />
  <circle stroke-width="1.6" cx="565" cy="124" r="9" fill="none" stroke="#176553" />
  <path d="M560 124l3 3 6 -6" stroke="#176553" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="557" y="102" text-anchor="start" font-size="13" fill="#4b6076" font-weight="400">First contact · Active</text>
  <text x="581" y="130" text-anchor="start" font-size="17" fill="#176553" font-weight="600">Allow conversation</text>
  <rect x="545" y="185" width="222" height="64" rx="10" fill="#fbf1f2" />
  <circle stroke-width="1.6" cx="565" cy="224" r="9" fill="none" stroke="#9a3943" />
  <path d="M562 221l6 6m0 -6l-6 6" stroke="#9a3943" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="557" y="202" text-anchor="start" font-size="13" fill="#4b6076" font-weight="400">Next contact · Revoked</text>
  <text x="581" y="230" text-anchor="start" font-size="17" fill="#9a3943" font-weight="600">Block conversation</text>
</svg>
