    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#8497a9" />
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="324" rx="0" fill="#ffffff" />
  <rect x="81" y="7" width="269" height="60" rx="10" fill="#f0f5fb" />
