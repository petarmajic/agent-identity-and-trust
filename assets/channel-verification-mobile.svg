  <circle stroke-width="1.6" cx="26" cy="288" r="9" fill="none" stroke="#176553" />
  <path d="M21 288l3 3 6 -6" stroke="#176553" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="18" y="266" text-anchor="start" font-size="13" fill="#4b6076" font-weight="400">First contact · Active</text>
  <text x="42" y="294" text-anchor="start" font-size="17" fill="#176553" font-weight="600">Allow</text>
  <rect x="184" y="249" width="170" height="64" rx="10" fill="#fbf1f2" />
