  <text x="132" y="32" text-anchor="start" font-size="17" fill="#1c324b" font-weight="600">Identity registry</text>
  <text x="132" y="53" text-anchor="start" font-size="14" fill="#4b6076" font-weight="400">Verified brand · Account M-01</text>
  <path d="M237 68V94" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="3 4" />
  <path d="M-5 -13V-17M-6 -17H-4 M-14 -11H14Q18 -11 18 -7V10Q18 14 14 14H-14Q-18 14 -18 10V-7Q-18 -11 -14 -11Z M-8 -2V2M8 -2V2M-5 8H5" transform="translate(52 117) scale(0.9)" fill="#edf4fc" stroke="#295e9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M0 -19Q9 -13 17 -12V0Q16 12 0 20Q-16 12 -17 0V-12Q-9 -13 0 -19Z M-8 0L-2 6L9 -6" transform="translate(237 117) scale(0.95)" fill="#edf4fc" stroke="#295e9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M77 117H211" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="143" y="106" text-anchor="middle" font-size="13" fill="#4b6076" font-weight="400">Signed proof</text>
