  <text x="52" y="176" text-anchor="middle" font-size="13" fill="#4b6076" font-weight="400">Support agent</text>
  <text x="237" y="156" text-anchor="middle" font-size="17" fill="#1c324b" font-weight="600">Verification API</text>
  <text x="237" y="176" text-anchor="middle" font-size="13" fill="#4b6076" font-weight="400">Proof, binding, scope and status</text>
  <path d="M237 185V196Q237 201 232 201H182" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="180" y="221" text-anchor="middle" font-size="15" fill="#1c324b" font-weight="600">Channel decision</text>
  <path d="M180 228V233H90V245" stroke="#8497a9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
